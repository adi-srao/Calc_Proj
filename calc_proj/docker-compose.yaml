services:
  calculator:
    image: calculator-api:latest
    environment:
      - SERVER_PORT=8888
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks: [calc-net]

  nginx:
    image: nginx:alpine
    ports: ["8081:80"]
    volumes: ["./nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on:
      calculator:
        condition: service_healthy
    restart: unless-stopped
    networks: [calc-net]

networks:
  calc-net: